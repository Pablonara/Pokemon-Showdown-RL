<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>02 パステルブラインド — kemonomimi.love</title>
<!-- Original animation for kemonomimi.love. Pattern-inspired by yui540 (MIT); no code copied. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap");
  :root {
    --cream: #fff9f0; --sakura: #ffb7c5; --hot: #ff5c8a; --mint: #b8e8d8;
    --lavender: #cdbbf5; --ink: #2a2a45;
    --snap: cubic-bezier(0.8, 0.05, 0.1, 0.98);
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: "Zen Maru Gothic", sans-serif;
    min-height: 100vh; display: grid; place-items: center; overflow: hidden; }

  /* ---------- hero ---------- */
  .hero { text-align: center; padding: 24px; }
  .hero h1 { font-size: clamp(38px, 8.5vw, 80px); font-weight: 900; }
  .hero h1 span { display: inline-block; }
  .lead { font-size: clamp(13px, 2.2vw, 16px); letter-spacing: .18em; margin-top: 20px; }
  .caption { font-family: "JetBrains Mono", monospace; font-size: 8.5px; letter-spacing: .4em;
    text-indent: .4em; color: var(--hot); margin-top: 14px; }
  .play .hero h1 span { animation: charUp .55s var(--snap) both; animation-delay: calc(1.5s + var(--i) * 0.06s); }
  .play .lead    { animation: charUp .55s var(--snap) 2.05s both; }
  .play .caption { animation: charUp .55s var(--snap) 2.2s both; }
  @keyframes charUp { from { opacity: 0; transform: translateY(.55em) rotate(5deg); } to { opacity: 1; transform: none; } }

  /* ---------- pastel blinds: 5 columns, shuffled stagger, two-tone chase ---------- */
  .blinds { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); pointer-events: none; z-index: 20; }
  .col { position: relative; overflow: hidden; }
  .col::before, .col::after { content: ""; position: absolute; inset: 0; transform: translateY(-103%); }
  .col::before { background: var(--tone); z-index: 2; }
  .col::after  { background: var(--ink);  z-index: 1; }
  .play .col::before { animation: fall 1.9s var(--snap) both; animation-delay: var(--d); }
  .play .col::after  { animation: fall 1.9s var(--snap) both; animation-delay: calc(var(--d) + 0.13s); }
  @keyframes fall {
    0%   { transform: translateY(-103%); }
    40%  { transform: translateY(0); }
    58%  { transform: translateY(0); }
    100% { transform: translateY(103%); }
  }
  .col:nth-child(1) { --tone: var(--sakura);   --d: 0.12s; }
  .col:nth-child(2) { --tone: var(--mint);     --d: 0.34s; }
  .col:nth-child(3) { --tone: var(--lavender); --d: 0s;    }
  .col:nth-child(4) { --tone: var(--sakura);   --d: 0.44s; }
  .col:nth-child(5) { --tone: var(--mint);     --d: 0.22s; }

  /* ---------- JP furniture ---------- */
  .deco-v { position: fixed; top: 30px; right: 28px; writing-mode: vertical-rl; font-size: 10px;
    font-weight: 700; letter-spacing: .34em; opacity: .5; z-index: 5; }
  .deco-url { position: fixed; left: 26px; bottom: 24px; font-family: "JetBrains Mono", monospace;
    font-size: 9px; letter-spacing: .3em; opacity: .45; z-index: 5; }
  .replay { position: fixed; right: 22px; bottom: 22px; z-index: 30; overflow: hidden;
    display: grid; gap: 3px; justify-items: center; background: var(--cream);
    border: 1px solid var(--ink); border-radius: 2px; padding: 11px 20px 9px; cursor: pointer;
    font-family: "Zen Maru Gothic", sans-serif; color: var(--ink); }
  .replay .jp { position: relative; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-indent: .22em; }
  .replay .en { position: relative; font-family: "JetBrains Mono", monospace; font-size: 7.5px;
    letter-spacing: .4em; text-indent: .4em; color: var(--hot); }
  .replay::before { content: ""; position: absolute; inset: 0; background: var(--sakura);
    transform: translateX(-101%); transition: transform .35s var(--snap); }
  .replay:hover::before { transform: translateX(0); }
  @media (max-width: 720px) { .deco-v, .deco-url { display: none; } }

</style>
</head>
<body>
  <div class="blinds">
    <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
  </div>

  <p class="deco-v">けもみみ研究所・二〇二五</p>
  <p class="deco-url">kemonomimi.love</p>

  <main class="hero">
    <h1>
      <span style="--i:0">け</span><span style="--i:1">も</span><span style="--i:2">み</span><span style="--i:3">み</span><span
      style="--i:4">研</span><span style="--i:5">究</span><span style="--i:6">所</span>
    </h1>
    <p class="lead">かわいくて、つよい。それだけ。</p>
    <p class="caption">CUTE AGENTS, RUTHLESS POLICIES</p>
  </main>

  <button class="replay" onclick="replay()"><span class="jp">もういちど</span><span class="en">REPLAY</span></button>
  <script>
    function replay(){ document.body.classList.remove("play"); void document.body.offsetWidth; document.body.classList.add("play"); }
    addEventListener("load", () => document.body.classList.add("play"));
  </script>
</body>
</html>
