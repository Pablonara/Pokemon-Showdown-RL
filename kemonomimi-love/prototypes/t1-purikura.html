<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T1 プリクラ手帳 — kemonomimi.love</title>
<!-- Original animation for kemonomimi.love. Heisei girly-notebook / purikura genre study. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap");
  :root {
    --cream: #fff9f0; --sakura: #ffb7c5; --hot: #ff5c8a; --mint: #b8e8d8;
    --lavender: #cdbbf5; --ink: #4a3a50;
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Hachi Maru Pop", cursive; color: var(--ink); min-height: 100vh;
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(circle at 18% 28%, rgba(255,183,197,.4) 0 7px, transparent 8px),
      radial-gradient(circle at 68% 12%, rgba(205,187,245,.4) 0 6px, transparent 7px),
      radial-gradient(circle at 84% 62%, rgba(184,232,216,.5) 0 7px, transparent 8px),
      radial-gradient(circle at 34% 78%, rgba(255,183,197,.35) 0 6px, transparent 7px),
      linear-gradient(160deg, #ffe3ec, #fff9f0 48%, #e2f6ee);
    background-size: 260px 260px, 300px 300px, 280px 280px, 320px 320px, 100% 100%; }

  /* ---------- polaroid card ---------- */
  .card { position: relative; background: #fff; border-radius: 18px; padding: 56px 48px 48px;
    box-shadow: 0 10px 30px rgba(255,92,138,.16); text-align: center; max-width: min(560px, 88vw); }
  .play .card { animation: cardIn .55s var(--pop) .25s both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.6) rotate(-7deg); } to { opacity: 1; transform: none; } }

  .tape { position: absolute; width: 92px; height: 26px; background: rgba(205,187,245,.7); }
  .tape.tl { top: -12px; left: -26px;  transform: rotate(-38deg); }
  .tape.tr { top: -12px; right: -26px; transform: rotate(38deg); background: rgba(184,232,216,.75); }
  .play .tape { animation: slap .3s var(--pop) both; }
  .play .tape.tl { animation-delay: .8s; }
  .play .tape.tr { animation-delay: .95s; }
  @keyframes slap { from { opacity: 0; transform: scale(1.7) rotate(0deg); } }

  h1 { font-size: clamp(26px, 6vw, 44px); color: var(--hot);
    text-shadow: -2px 0 #fff, 2px 0 #fff, 0 -2px #fff, 0 2px #fff, 3px 3px 0 var(--sakura); }
  .lead { font-size: clamp(13px, 2.4vw, 16px); margin-top: 18px; line-height: 2; }
  .lead b { background: linear-gradient(transparent 60%, var(--mint) 60% 92%, transparent 92%); font-weight: 400; }
  .play h1    { animation: rise .5s var(--pop) .6s both; }
  .play .lead { animation: rise .5s var(--pop) .75s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* ---------- stickers ---------- */
  .stk { position: absolute; display: grid; place-items: center; text-align: center;
    font-size: 12px; line-height: 1.3; }
  .play .stk { animation: slapR .35s var(--pop) both; }
  @keyframes slapR { from { opacity: 0; transform: scale(1.8) rotate(14deg); } }
  .stk.elo { width: 96px; height: 96px; border-radius: 50%; background: var(--mint);
    right: -34px; top: -30px; transform: rotate(8deg); border: 3px dotted #fff; }
  .play .stk.elo { animation-delay: 1.2s; }
  .stk.sota { width: 104px; height: 104px; background: var(--lavender); color: #fff;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    left: -40px; bottom: -18px; transform: rotate(-10deg); font-size: 13px; }
  .play .stk.sota { animation-delay: 1.38s; }
  .stk.nya { padding: 10px 16px; background: var(--sakura); color: #fff; border-radius: 999px;
    left: -30px; top: -22px; transform: rotate(-12deg); }
  .stk.nya::after { content: ""; position: absolute; bottom: -8px; left: 26px;
    border: 6px solid transparent; border-top-color: var(--sakura); }
  .play .stk.nya { animation-delay: 1.56s; }
  .stk.heart { right: -18px; bottom: -26px; font-size: 44px; color: var(--hot);
    text-shadow: -2px 0 #fff, 2px 0 #fff, 0 -2px #fff, 0 2px #fff; transform: rotate(10deg); }
  .play .stk.heart { animation-delay: 1.74s; }

  /* floating doodles */
  .doodle { position: fixed; font-size: 22px; color: var(--hot); opacity: .55; }
  .doodle.d1 { top: 14%; left: 12%; }
  .doodle.d2 { top: 20%; right: 16%; color: #9c88d8; }
  .doodle.d3 { bottom: 16%; left: 20%; color: #5bbd9d; }
  .doodle.d4 { bottom: 22%; right: 12%; }
  .play .doodle { animation: floaty 3.2s ease-in-out infinite alternate; }
  .play .d2 { animation-delay: .6s; } .play .d3 { animation-delay: 1.1s; } .play .d4 { animation-delay: 1.7s; }
  @keyframes floaty { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-14px) rotate(8deg); } }

  .replay { position: fixed; right: 22px; bottom: 22px; z-index: 30;
    font-family: "Hachi Maru Pop", cursive; font-size: 13px; color: var(--hot);
    background: #fff; border: 2px dashed var(--hot); border-radius: 999px;
    padding: 12px 22px; cursor: pointer; transition: background .25s, color .25s; }
  .replay:hover { background: var(--sakura); color: #fff; }

</style>
</head>
<body>
  <span class="doodle d1">☆</span><span class="doodle d2">♪</span>
  <span class="doodle d3">〇</span><span class="doodle d4">♡</span>

  <main class="card">
    <span class="tape tl"></span><span class="tape tr"></span>
    <span class="stk nya">にゃー！</span>
    <span class="stk elo">つよさ<br>2143 ↑</span>
    <span class="stk sota">せかい<br>いち</span>
    <span class="stk heart">♥</span>
    <h1>けもみみ<br>けんきゅうじょ</h1>
    <p class="lead">せかいいち <b>かわいくて つよい</b> けんきゅうしつ。<br>きょうも 93まんかい たたかったよ。</p>
  </main>

  <button class="replay" onclick="replay()">もっかい！</button>
  <script>
    function replay(){ document.body.classList.remove("play"); void document.body.offsetWidth; document.body.classList.add("play"); }
    addEventListener("load", () => document.body.classList.add("play"));
  </script>
</body>
</html>
