<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T4 和風・襖びらき — kemonomimi.love</title>
<!-- Original animation for kemonomimi.love. Washi / fusuma-opening genre study. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap");
  :root {
    --washi: #fbf5ea; --ink: #3d3242; --hot: #d94f6a; --sakura: #f6c9d4; --petal: #ffd3de;
    --snap: cubic-bezier(0.8, 0.05, 0.1, 0.98);
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Shippori Mincho", serif; background: var(--washi); color: var(--ink);
    min-height: 100vh; overflow: hidden; }

  /* seigaiha wave band */
  .waves { position: fixed; left: 0; right: 0; bottom: 0; height: 24vh; opacity: .5; pointer-events: none;
    background:
      radial-gradient(circle at 50% 0, transparent 34%, var(--sakura) 36% 39%, transparent 41%,
        transparent 52%, var(--sakura) 54% 57%, transparent 59%,
        transparent 70%, var(--sakura) 72% 75%, transparent 77%);
    background-size: 64px 64px; background-position: 0 0, 32px 32px; }
  .waves.b { background-position: 32px 32px; opacity: .35; }

  /* ---------- fusuma panels ---------- */
  .fusuma { position: fixed; top: 0; bottom: 0; width: 50.6vw; z-index: 20;
    background: linear-gradient(180deg, #f7efdd, #efe3c8);
    box-shadow: inset 0 0 60px rgba(61,50,66,.08); }
  .fusuma.l { left: 0; border-right: 10px solid #decfa8; }
  .fusuma.r { right: 0; border-left: 10px solid #decfa8; }
  .fusuma .crest { position: absolute; top: 50%; width: 84px; aspect-ratio: 1; border-radius: 50%;
    border: 2.5px solid var(--hot); color: var(--hot); display: grid; place-items: center;
    font-size: 34px; font-weight: 800; }
  .fusuma.l .crest { right: 34px; transform: translateY(-50%); }
  .fusuma.r .crest { left: 34px; transform: translateY(-50%); }
  .play .fusuma { animation: open 1.6s var(--snap) both; }
  .play .fusuma.r { animation-name: openR; }
  @keyframes open  { 0%, 22% { transform: translateX(0); } 100% { transform: translateX(-103%); } }
  @keyframes openR { 0%, 22% { transform: translateX(0); } 100% { transform: translateX(103%); } }

  /* ---------- vertical hero text ---------- */
  .hero { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
    gap: clamp(28px, 6vw, 72px); flex-direction: row-reverse; }
  h1 { writing-mode: vertical-rl; font-size: clamp(44px, 9vw, 88px); font-weight: 800;
    letter-spacing: .22em; }
  h1 .dot { color: var(--hot); }
  .sub { writing-mode: vertical-rl; font-size: clamp(14px, 2.4vw, 19px); font-weight: 500;
    letter-spacing: .42em; padding-top: 10px; }
  .play h1   { animation: slideIn .8s var(--snap) 1.35s both; }
  .play .sub { animation: slideIn .8s var(--snap) 1.55s both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }

  /* rakkan seal */
  .rakkan { writing-mode: vertical-rl; align-self: flex-end; margin-bottom: 12vh;
    background: var(--hot); color: var(--washi); font-weight: 700; font-size: 17px;
    padding: 10px 7px; border-radius: 3px; letter-spacing: .2em; transform: rotate(-3deg); }
  .play .rakkan { animation: stamp .35s var(--pop) 2.1s both; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.9) rotate(-14deg); } to { opacity: 1; transform: rotate(-3deg); } }

  /* ---------- falling petals ---------- */
  .petal { position: fixed; top: -6vh; width: 13px; height: 15px; background: var(--petal);
    border-radius: 62% 38% 55% 45% / 50% 60% 40% 50%; opacity: .85; z-index: 5; }
  .play .petal { animation: fall linear infinite; }
  .petal:nth-child(1) { left: 8%;  animation-duration: 9s;    animation-delay: 1.6s; }
  .petal:nth-child(2) { left: 26%; animation-duration: 11s;   animation-delay: 2.4s; }
  .petal:nth-child(3) { left: 47%; animation-duration: 8.5s;  animation-delay: 3.4s; }
  .petal:nth-child(4) { left: 66%; animation-duration: 10.5s; animation-delay: 1.9s; }
  .petal:nth-child(5) { left: 82%; animation-duration: 9.5s;  animation-delay: 2.9s; }
  .petal:nth-child(6) { left: 93%; animation-duration: 12s;   animation-delay: 4.2s; }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0) rotate(0); }
    25%  { transform: translateY(28vh) translateX(-3vw) rotate(95deg); }
    50%  { transform: translateY(56vh) translateX(2vw) rotate(190deg); }
    75%  { transform: translateY(84vh) translateX(-2vw) rotate(280deg); }
    100% { transform: translateY(116vh) translateX(1vw) rotate(360deg); }
  }

  .deco-v { position: fixed; top: 30px; left: 28px; writing-mode: vertical-rl; font-size: 11px;
    font-weight: 500; letter-spacing: .5em; opacity: .55; }

  .replay { position: fixed; right: 22px; bottom: 22px; z-index: 30; writing-mode: vertical-rl;
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 13px; letter-spacing: .3em;
    color: var(--ink); background: var(--washi); border: 1px solid var(--ink); border-radius: 2px;
    padding: 18px 11px; cursor: pointer; overflow: hidden; }
  .replay span { position: relative; }
  .replay::before { content: ""; position: absolute; inset: 0; background: var(--sakura);
    transform: translateY(-101%); transition: transform .35s var(--snap); }
  .replay:hover::before { transform: translateY(0); }
  @media (max-width: 720px) { .deco-v { display: none; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <div class="waves"></div><div class="waves b"></div>
  <i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i>

  <div class="fusuma l"><span class="crest">猫</span></div>
  <div class="fusuma r"><span class="crest">耳</span></div>

  <p class="deco-v">二〇二五年　葉月</p>

  <main class="hero">
    <h1>猫耳は、最強<span class="dot">。</span></h1>
    <p class="sub">勝つために生まれた、猫耳たち。</p>
    <span class="rakkan">愛</span>
  </main>

  <button class="replay" onclick="replay()"><span>もういちど</span></button>
  <script>
    function replay(){ document.body.classList.remove("play"); void document.body.offsetWidth; document.body.classList.add("play"); }
    addEventListener("load", () => document.body.classList.add("play"));
  </script>
</body>
</html>
