<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>06 完全版・猫耳カーテン — kemonomimi.love</title>
<!-- Original animation for kemonomimi.love. Three-act opening: title card -> dot burst -> ear-curtain reveal. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap");
  :root {
    --cream: #fff9f0; --sakura: #ffb7c5; --hot: #ff5c8a; --mint: #b8e8d8; --ink: #2a2a45;
    --snap: cubic-bezier(0.8, 0.05, 0.1, 0.98);
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    --rush: cubic-bezier(0.7, 0.05, 0.95, 0.5);
    --ears: polygon(0 7%, 13% 7%, 21% 0, 29% 7%, 71% 7%, 79% 0, 87% 7%, 100% 7%, 100% 100%, 0 100%);
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: "Zen Maru Gothic", sans-serif;
    min-height: 100vh; display: grid; place-items: center; overflow: hidden; }

  /* ============ ACT 1: ink title card ============ */
  .cover { position: fixed; inset: 0; background: var(--ink); z-index: 35; opacity: 0; pointer-events: none; }
  .play .cover { animation: hideStep .02s linear 2.84s both; }
  @keyframes hideStep { from { opacity: 1; } to { opacity: 0; } }

  .tcard { position: fixed; inset: 0; z-index: 36; display: grid; place-content: center;
    text-align: center; opacity: 0; pointer-events: none; }
  .play .tcard { animation: hideStep .02s linear 2.84s both; }
  .tcard h2 { color: #fff; font-weight: 900; font-size: clamp(30px, 7vw, 58px); letter-spacing: .08em; }
  .tcard .ch { display: inline-block; }
  .play .tcard .ch { animation: chIn .4s var(--snap) both, chOut .24s var(--snap) forwards; }
  .play .tcard .ch:nth-child(1) { animation-delay: .20s, 2.10s; }
  .play .tcard .ch:nth-child(2) { animation-delay: .29s, 2.13s; }
  .play .tcard .ch:nth-child(3) { animation-delay: .38s, 2.16s; }
  .play .tcard .ch:nth-child(4) { animation-delay: .47s, 2.19s; }
  .play .tcard .ch:nth-child(5) { animation-delay: .56s, 2.22s; }
  .play .tcard .ch:nth-child(6) { animation-delay: .65s, 2.25s; }
  .play .tcard .ch:nth-child(7) { animation-delay: .74s, 2.28s; }
  @keyframes chIn  { from { opacity: 0; clip-path: inset(100% 0 0 0); transform: translateY(.22em); }
                     to   { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes chOut { from { clip-path: inset(0 0 0 0); transform: none; }
                     to   { clip-path: inset(0 0 100% 0); transform: translateY(-.18em); } }
  .tcard .cap { color: var(--sakura); font-size: 10px; font-weight: 700; letter-spacing: .5em;
    text-indent: .5em; margin-top: 20px; }
  .play .tcard .cap { animation: fadeIn .5s var(--snap) 1.1s both, chOut .2s var(--snap) 2.1s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ACT 2: the punctuation dot appears... then devours the screen */
  .tcard .dot { display: inline-block; width: .3em; aspect-ratio: 1; border-radius: 50%;
    background: var(--sakura); margin-left: .12em; will-change: transform; }
  .play .tcard .dot { animation: dotIn .34s var(--pop) 1.35s both, dotGrow .62s var(--rush) 2.22s both; }
  @keyframes dotIn   { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes dotGrow { from { transform: scale(1); } 18% { transform: scale(.72); } to { transform: scale(300); } }

  /* ============ ACT 3: ear-curtains drop away — the ear edge travels the screen ============ */
  .veil { position: fixed; left: 0; top: -7.5vh; width: 100vw; height: 115vh;
    clip-path: var(--ears); transform: translateY(103%); pointer-events: none; }
  .veil.sakura { background: var(--sakura); z-index: 34; }
  .veil.ink2   { background: var(--ink);    z-index: 33; }
  .play .veil.sakura { animation: earUp 1.0s var(--snap) 2.88s both; }
  .play .veil.ink2   { animation: earUp 1.0s var(--snap) 3.04s both; }
  @keyframes earUp {
    0%   { transform: translateY(0); }
    12%  { transform: translateY(-1.4%); }  /* anticipation: rises a hair, then drops */
    100% { transform: translateY(103%); }
  }

  /* ============ hero (base = final) ============ */
  .hero { text-align: center; padding: 24px; position: relative; z-index: 2; }
  .kicker { font-size: 10px; font-weight: 700; letter-spacing: .42em; text-indent: .42em;
    color: var(--hot); margin-bottom: 18px; }
  .hero h1 { font-size: clamp(40px, 9vw, 88px); font-weight: 900; letter-spacing: .02em; }
  .hero h1 .dot2 { color: var(--hot); display: inline-block; }
  .lead { font-size: clamp(13px, 2.2vw, 16px); letter-spacing: .18em; margin-top: 18px; }
  .stats { display: inline-block; margin-top: 26px; padding: 11px 8px;
    border-top: 1px dashed var(--hot); border-bottom: 1px dashed var(--hot);
    font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .play .kicker { animation: rise .6s var(--snap) 3.42s both; }
  .play .hero h1 { animation: riseSettle .7s var(--snap) 3.52s both; }
  .play .lead   { animation: rise .6s var(--snap) 3.68s both; }
  .play .stats  { animation: rise .6s var(--snap) 3.82s both; }
  .play .hero h1 .dot2 { animation: nod .5s var(--pop) 4.6s; }  /* follow-through */
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes riseSettle { from { opacity: 0; transform: translateY(30px) scale(1.05); } to { opacity: 1; transform: none; } }
  @keyframes nod { 0%, 100% { transform: none; } 40% { transform: translateY(-.14em); } 70% { transform: translateY(.04em); } }

  /* ambient drift (secondary action, very quiet) */
  .fuwa { position: fixed; width: 30vmin; aspect-ratio: 1; border-radius: 50%; z-index: 1;
    filter: blur(60px); opacity: 0; }
  .fuwa.a { background: var(--sakura); top: 12%; left: 10%; }
  .fuwa.b { background: var(--mint); bottom: 10%; right: 8%; }
  .play .fuwa { animation: fuwaIn 1.2s ease-out 4.1s both, drift 26s ease-in-out 4.1s infinite alternate; }
  .play .fuwa.b { animation-delay: 4.3s, 4.3s; animation-duration: 1.2s, 32s; }
  @keyframes fuwaIn { to { opacity: .3; } }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(5vmin, -4vmin); } }

  /* ============ JP furniture ============ */
  .deco-v { position: fixed; top: 30px; right: 28px; writing-mode: vertical-rl; font-size: 10px;
    font-weight: 700; letter-spacing: .34em; opacity: .5; z-index: 5; }
  .deco-url { position: fixed; left: 26px; bottom: 24px; font-size: 9.5px; font-weight: 700;
    letter-spacing: .3em; opacity: .45; z-index: 5; }
  .replay { position: fixed; right: 22px; bottom: 22px; z-index: 50; overflow: hidden;
    display: grid; gap: 3px; justify-items: center; background: var(--cream);
    border: 1px solid var(--ink); border-radius: 2px; padding: 11px 20px 9px; cursor: pointer;
    font-family: "Zen Maru Gothic", sans-serif; color: var(--ink); }
  .replay .jp { position: relative; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-indent: .22em; }
  .replay .en { position: relative; font-size: 8px; font-weight: 700; letter-spacing: .4em;
    text-indent: .4em; color: var(--hot); }
  .replay::before { content: ""; position: absolute; inset: 0; background: var(--sakura);
    transform: translateX(-101%); transition: transform .35s var(--snap); }
  .replay:hover::before { transform: translateX(0); }
  @media (max-width: 720px) { .deco-v, .deco-url { display: none; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <div class="veil ink2"></div>
  <div class="veil sakura"></div>
  <div class="cover"></div>

  <div class="tcard">
    <h2><span class="ch">け</span><span class="ch">も</span><span class="ch">み</span><span
      class="ch">み</span><span class="ch">研</span><span class="ch">究</span><span class="ch">所</span><span class="dot"></span></h2>
    <p class="cap">KEMONOMIMI RESEARCH DIVISION</p>
  </div>

  <span class="fuwa a"></span><span class="fuwa b"></span>
  <p class="deco-v">けもみみ研究所・二〇二五</p>
  <p class="deco-url">kemonomimi.love</p>

  <main class="hero">
    <p class="kicker">KEMONOMIMI RESEARCH DIVISION</p>
    <h1>猫耳は、最強<span class="dot2">。</span></h1>
    <p class="lead">勝つために生まれた、猫耳たち。</p>
    <p class="stats">930K battles/s ・ 忠実度 1000/1000 ・ 報酬は ±1 のみ</p>
  </main>

  <button class="replay" onclick="replay()"><span class="jp">もういちど</span><span class="en">REPLAY</span></button>
  <script>
    function replay(){ document.body.classList.remove("play"); void document.body.offsetWidth; document.body.classList.add("play"); }
    addEventListener("load", () => document.body.classList.add("play"));
  </script>
</body>
</html>
